name: Deploy Qivy Studio

# Deploys the editorial dashboard Worker.
#
# Deliberately runs here rather than from a laptop: the whole point of moving
# off n8n was to stop depending on one machine being switched on. Nobody needs
# wrangler installed locally.
#
# Requires one repository secret:
#   CLOUDFLARE_API_TOKEN — a Cloudflare API token with
#     Account → Workers Scripts → Edit
#     Account → Workers KV Storage → Edit
#     Account → D1 → Edit
#     Zone  → Workers Routes → Edit   (on qivy.in, for the custom domain)
#
# See studio/README.md.

on:
  push:
    branches: [main]
    paths:
      - 'studio/**'
      - '.github/workflows/deploy-studio.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Fails the deploy on a syntax error rather than shipping a Worker that
      # throws on first request.
      - name: Syntax check
        run: |
          for f in studio/src/*.js; do node --check "$f"; done

      # Until the token exists this is "not set up yet", not "broken". A red
      # X for unfinished setup trains you to ignore red X's.
      - name: Is the Cloudflare token set?
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set, so there is nothing to deploy to. See studio/README.md step 1."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        if: steps.gate.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Pinned: the action's default is wrangler 3, which is out of date.
          wranglerVersion: '4'
          workingDirectory: studio
