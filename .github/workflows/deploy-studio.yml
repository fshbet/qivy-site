name: Deploy Qivy Studio

# Deploys the editorial dashboard Worker.
#
# Deliberately runs here rather than from a laptop: the whole point of moving
# off n8n was to stop depending on one machine being switched on. Nobody needs
# wrangler installed locally.
#
# Requires one repository secret:
#   CLOUDFLARE_API_TOKEN — a Cloudflare API token with
#     Account → Workers Scripts → Edit
#     Account → Workers KV Storage → Edit
#     Account → D1 → Edit
#     Zone  → Workers Routes → Edit   (on qivy.in, for the custom domain)
#
# See studio/README.md.

on:
  push:
    branches: [main]
    paths:
      - 'studio/**'
      - '.github/workflows/deploy-studio.yml'
  workflow_dispatch:

# This workflow reads its own source and talks to Cloudflare; it needs nothing
# else from the repository. Stated here rather than inherited, so it does not
# quietly widen if the account-wide default is ever changed from "read".
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Fails the deploy on a syntax error rather than shipping a Worker that
      # throws on first request.
      - name: Syntax check
        run: |
          for f in studio/src/*.js; do node --check "$f"; done

      # Syntax-only was not enough: a chain that exceeded OpenRouter's
      # 3-model limit parsed fine and broke every run with HTTP 400. The
      # tests encode limits like that, so they gate the deploy now.
      - name: Tests
        run: node studio/test.mjs

      # Until the token exists this is "not set up yet", not "broken". A red
      # X for unfinished setup trains you to ignore red X's.
      - name: Is the Cloudflare token set?
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set, so there is nothing to deploy to. See studio/README.md step 1."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # If this ever fails with "No access to the specified resource", the error
      # does not say WHICH access is missing. A token scoped to the wrong
      # account and a token missing Edit look identical here. Check it by hand
      # rather than printing the answer into this public repo's build logs:
      #   curl -s -H "Authorization: Bearer $TOKEN"       #     https://api.cloudflare.com/client/v4/user/tokens/verify
      #   ...then /accounts, and /accounts/<id>/workers/scripts
      - name: Deploy
        if: steps.gate.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Pinned: the action's default is wrangler 3, which is out of date.
          wranglerVersion: '4'
          workingDirectory: studio
