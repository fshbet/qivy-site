# Draft with Claude, fall back to OpenRouter, publish five a day.
#
# Runs on GitHub's cloud, so it does not care whether your PC is on. Claude
# authenticates with your Claude subscription through CLAUDE_CODE_OAUTH_TOKEN,
# not an API key — see pipeline/README.md for the one-time setup.
#
# The order of the steps is the design:
#   check    refuses to spend a model call on a broken queue
#   claude   writes JSON into pipeline/inbox/ and nothing else
#   ingest   puts every article through the SAME validator the dashboard uses
#   fallback only if Claude produced nothing usable
#   promote  moves up to five clean drafts into the live site
#   commit   one commit, which triggers the Pages build
name: Articles

on:
  schedule:
    # 01:00 UTC = 06:30 IST, before the day starts.
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      publish_limit:
        description: 'How many drafts to publish this run'
        required: false
        default: '5'

# Least privilege, but contents:write is unavoidable: the whole job is to
# commit articles. id-token:write is what the Claude action needs for its
# default GitHub App authentication, and what deploy-pages uses to prove it
# is allowed to publish. pages:write is for the deploy job at the bottom.
permissions:
  contents: write
  id-token: write
  pages: write

# Never two runs committing to main at once. A scheduled run and a manual one
# landing together would conflict on the queue file.
concurrency:
  group: articles
  cancel-in-progress: false

jobs:
  articles:
    runs-on: ubuntu-latest
    outputs:
      # Whether anything was actually committed, so the deploy below does not
      # republish identical content on a day that produced no article.
      committed: ${{ steps.commit.outputs.committed }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Fails the run before anything expensive happens: a bad category, an
      # article whose title cannot be parsed, two queued topics that are the
      # same article.
      - name: Check the queue
        run: node pipeline/check.mjs

      # Claude gets Read, Write, Edit and the research tools, and NOT Bash.
      # That is deliberate and it is the only thing stopping it committing:
      # the action's docs say Claude has no shell until you grant it, so
      # leaving Bash out means it cannot run git even if asked to.
      - name: Draft with Claude
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: 'Read pipeline/PROMPT.md and follow it exactly. It is your complete brief.'
          claude_args: |
            --allowedTools "Read,Write,Edit,Glob,Grep,WebFetch,WebSearch"

      # Validates whatever Claude left behind. Exits non-zero when the inbox
      # was empty or nothing in it was usable, which is what the fallback
      # below keys off.
      - name: Validate what Claude wrote
        id: ingest
        continue-on-error: true
        run: node pipeline/ingest.mjs

      # Only when Claude produced nothing usable — a bad token, an outage, a
      # run that wrote no files. A failed Claude step should cost a better
      # article, not the whole day.
      - name: Fall back to OpenRouter
        if: steps.claude.outcome != 'success' || steps.ingest.outcome != 'success'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "Claude step: ${{ steps.claude.outcome }}, ingest: ${{ steps.ingest.outcome }}"
          node pipeline/draft.mjs --count 10

      - name: Publish up to the daily limit
        run: node pipeline/promote.mjs --limit ${{ github.event.inputs.publish_limit || '5' }}

      # src/content.config.ts is the real content gate, and until this step
      # existed it only ran in deploy.yml -- AFTER the commit. So an article
      # that broke the schema committed cleanly and then failed the Pages
      # build, which blocked every later article behind it, in a red run
      # nobody was watching. Six seconds here, before anything lands.
      - name: Prove the site still builds
        run: |
          npm ci
          npm run build

      - name: Commit
        id: commit
        run: |
          git config user.name  'qivy-articles[bot]'
          git config user.email 'qivy-articles[bot]@users.noreply.github.com'
          git add -A pipeline src/content/articles
          if git diff --cached --quiet; then
            echo 'Nothing changed. Not committing.'
            echo 'committed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          published=$(git diff --cached --name-only --diff-filter=A -- src/content/articles | wc -l)
          git commit -m "Publish ${published} article(s) and update the drafting queue" \
                     -m 'Drafted and promoted by .github/workflows/articles.yml.'
          git push
          echo 'committed=true' >> "$GITHUB_OUTPUT"

      # The dist/ the build gate just produced, which is exactly what was
      # committed. Uploaded here so the deploy job below can publish it
      # without building the site a second time.
      - name: Keep the built site for the deploy
        if: steps.commit.outputs.committed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Why this job exists at all, and it is not tidiness:
  #
  # The commit above is made with the default GITHUB_TOKEN, and GitHub does
  # not start a workflow from a commit made with that token. So deploy.yml
  # never saw it. Measured on the first real run: five articles landed as
  # dc4f39f and every one answered 404 until the Pages build was started by
  # hand. deploy.yml's own 02:30 UTC schedule would have picked them up about
  # ninety minutes later, which is a gap and a dependency on two crons
  # staying in the right order, not a fix.
  #
  # It needs its own job because `environment` is set per job, and deploy
  # -pages requires the github-pages environment.
  deploy:
    needs: articles
    if: needs.articles.outputs.committed == 'true'
    runs-on: ubuntu-latest
    # Shares the group deploy.yml uses, so the two never publish to Pages at
    # the same moment. The group name is what matters, not the workflow.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
