name = "qivy-studio"
main = "src/index.js"
compatibility_date = "2026-11-07"

# SECURITY: Cloudflare Access protects a hostname, NOT the workers.dev URL.
# Leaving workers.dev enabled would publish an unauthenticated copy of this
# app that can spend your OpenRouter credits and commit to your repository.
# Keep this false. The Access JWT check in src/access.js is the second lock.
workers_dev = false

# The dashboard lives here. Change the hostname if you prefer another one —
# wrangler creates the DNS record on deploy, as long as qivy.in is in this
# Cloudflare account.
[[routes]]
pattern = "write.qivy.in"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "qivy-studio"
database_id = "b6a92c24-9238-4fd1-b778-9e3cbbc02aac"

[[kv_namespaces]]
binding = "SETTINGS"
id = "e9af20372ba641b692492afc84d9046e"

# No cron. Drafting moved to .github/workflows/articles.yml, where Claude
# writes on your subscription instead of a free model writing on OpenRouter.
#
# This is not tidying, it is required: the drafting queue was copied from D1
# into pipeline/topics.json, so both systems hold the same topics. Leaving
# this cron on would have the Worker and the workflow drafting the same topic
# from the same list on the same day, and neither would know.
#
# Everything else about the Worker still works, and that is the point of
# leaving it deployed: the dashboard still reviews and publishes the drafts
# already sitting in D1, and `/generate` still drafts one on demand. An empty
# array removes the triggers on the next deploy -- wrangler replaces whatever
# is there, so this is the whole switch.
[triggers]
crons = []

[vars]
GITHUB_OWNER = "fshbet"
GITHUB_REPO = "qivy-site"
GITHUB_BRANCH = "main"
SITE_URL = "https://qivy.in"

# Both MUST be set before the app will serve anything — it fails closed.
# ACCESS_TEAM_DOMAIN: "<your-team>.cloudflareaccess.com"
# ACCESS_AUD:         the Application Audience tag from the Access app.
# Set them here and redeploy, or in the dashboard under Settings → Variables.
ACCESS_TEAM_DOMAIN = "patient-silence-2588.cloudflareaccess.com"
ACCESS_AUD = "080c460e0c4462ef11d1c4328e859d85d8617350162b84a0675bf79a40fc862a"
